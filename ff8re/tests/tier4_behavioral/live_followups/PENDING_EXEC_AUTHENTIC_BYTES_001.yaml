id: "PENDING_EXEC_AUTHENTIC_BYTES_001"
title: "Inject command families and capture exec-queue bytes"
domain: "command_pipeline"
confidence_target: "medium"

# Injection-driven (no manual play): each case writes a pending action entry
# directly into the battle pending buffer, then lets the game transfer it to the
# exec queue. We capture the authentic *downstream* representation (exec-queue
# bytes, action globals, resolver state) for each command family.
#
# NOTE: because we inject the pending bytes directly (bypassing
# BattlePendingAction_Write @ PENDING_WRITE), the write function is NOT hit; we
# only assert the transfer (BattlePendingAction_TransferToExecQueue) consumed it.
#
# command_id values: 0x01 Attack, 0x02 Magic, 0x03 GF, 0x04 Draw, 0x05 Item
# (see docs/tech/reference/command_id_table.md). Draw cast vs stock share the
# same pending command_id (0x04); the distinction is resolved downstream, so they
# are merged into a single 'draw' case here.

references:
  - "ai-prompt/todo/ai_investigation_live_pending_exec_authentic_bytes.md"
  - "docs/tech/reference/pending_action.md"
  - "docs/tech/reference/command_id_table.md"
  - "docs/tech/test/test_command_pipeline.md"

matrix:
  - case: "attack"
    CMD_ID: 0x01
    CMD_ARG: 0x00
    TARGET_MASK: 0x08      # enemy slot 3
    ATTACKER_SLOT: 0
  - case: "magic"
    CMD_ID: 0x02
    CMD_ARG: 0x02          # Fira (confirmed injection)
    TARGET_MASK: 0x08
    ATTACKER_SLOT: 0
  - case: "item"
    CMD_ID: 0x05
    CMD_ARG: 0x01          # item id (inferred; tune from readback)
    TARGET_MASK: 0x01      # ally slot 0
    ATTACKER_SLOT: 0
  - case: "draw"
    CMD_ID: 0x04
    CMD_ARG: 0x02          # spell to draw/cast (inferred)
    TARGET_MASK: 0x08
    ATTACKER_SLOT: 0
  - case: "gf"
    CMD_ID: 0x03
    CMD_ARG: 0x42          # Ifrit (confirmed kernel GF id)
    TARGET_MASK: 0x8008
    ATTACKER_SLOT: 0

constants:
  ATB_TICK: 0x4842B0
  PENDING_WRITE: 0x484D20
  PENDING_TRANSFER: 0x4847F0
  MENU_PENDING_COUNT: 0x1D76718
  MENU_PENDING_BUFFER: 0x1D76721

setup:
  - action: sync_to_battle_tick
    label: "sync_atb"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: set_breakpoint
    label: "bp_pending_transfer"
    address: "PENDING_TRANSFER"

act:
  - action: write_pending_action
    label: "inject_pending"
    slot: 0
    fields:
      target_mask: "TARGET_MASK"
      attacker_slot: "ATTACKER_SLOT"
      command_id: "CMD_ID"
      command_arg: "CMD_ARG"
      active: 1
  - action: continue_execution
    label: "drive_to_transfer"
    timeout_ms: 15000
    wait_until:
      - "bp_pending_transfer"

observe:
  - action: trace_breakpoint_hits
    label: "pending_exec_trace"
    timeout_ms: 15000
    wait_until:
      - "bp_pending_transfer"
    max_hits: 2
    on_hit:
      - action: read_registers
        label: "regs"
      - action: read_stack_args
        label: "stack_args"
        fields:
          count: 4
          word_size: 4
      - action: read_action_globals
        label: "action_globals"
      - action: read_pending_action
        label: "pending0"
        slot: 0
      - action: read_exec_queue
        label: "exec_queue"
      - action: snapshot_memory
        label: "menu_pending_count"
        address: "MENU_PENDING_COUNT"
        size: 4
        type: u32
      - action: snapshot_memory
        label: "menu_pending_buffer"
        address: "MENU_PENDING_BUFFER"
        size: 16
        type: bytes

assert:
  - check: breakpoint_was_hit
    label: "sync_atb"
  - check: breakpoint_was_hit
    label: "bp_pending_transfer"

cleanup:
  - action: delete_breakpoint
    label: "bp_pending_transfer"

verdict_prompt: |
  Analyze the injected pending/exec byte capture for this command-family case.
  Focus on:
  1. The exec queue bytes captured after the injected pending entry transferred.
  2. The command globals (`COMMAND_TYPE_ID`, `CURRENT_ATTACK_MAGIC_GF_ITEM_COMMAND_ID`, `ATTACKER_SLOT_ID`).
  3. The pending0 readback (the bytes we injected) vs the exec-queue lanes.
  4. Whether the injected command_id flows to the expected resolver category
     (e.g. Item -> COMMAND_TYPE_ID 4, Magic -> 2, GF -> 254), confirming or
     refuting the inferred command_id for this family.
  Evidence:
  {evidence_json}
