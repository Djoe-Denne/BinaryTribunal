id: "GF_PAYLOAD_DUMP_001"
title: "Capture unresolved GF runtime payloads and slot deltas"
domain: "gforce"
confidence_target: "medium"

references:
  - "ai-prompt/todo/ai_investigation_live_gf_payload_dump.md"
  - "docs/tech/test/test_gf_injection.md"
  - "obsidian-docs/projects/re-ff8/concepts/gforce-catalog-and-families.md"

# Injection-driven (no manual play): each case injects the GF summon command
# (command_id 0x03, command_arg = kernel GF id) into pending entry 0, then lets
# the game transfer/dispatch it. Kernel GF ids from command_id_table.md.

matrix:
  - case: "doomtrain"
    GF_ARG: 0x4B          # Doomtrain (kernel id 75)
  - case: "alexander"
    GF_ARG: 0x4A          # Alexander (kernel id 74)
  - case: "cerberus"
    GF_ARG: 0x49          # Cerberus (kernel id 73)

constants:
  ATB_TICK: 0x4842B0
  PENDING_TRANSFER: 0x4847F0
  GF_CINEMATIC: 0x50B2A0
  GF_RESOLVE_STORE: 0x4850A0
  APPLY_DAMAGE: 0x494410
  GF_CALLBACK_PTR: 0x21DFEC4
  GF_SEQUENCE_CONTEXT: 0x1D99A50
  DAMAGE_RESULT_BUFFER: 0x1D28344
  GF_COMMAND_ID: 0x03
  GF_TARGET_MASK: 0x8008

setup:
  - action: sync_to_battle_tick
    label: "sync_atb"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: snapshot_all_slots
    label: "slots_before"
  - action: set_breakpoint
    label: "bp_pending_transfer"
    address: "PENDING_TRANSFER"
  - action: set_breakpoint
    label: "bp_gf_cinematic"
    address: "GF_CINEMATIC"
  - action: set_breakpoint
    label: "bp_gf_resolve_store"
    address: "GF_RESOLVE_STORE"
  - action: set_breakpoint
    label: "bp_apply_damage"
    address: "APPLY_DAMAGE"

act:
  - action: write_pending_action
    label: "inject_gf"
    slot: 0
    fields:
      target_mask: "GF_TARGET_MASK"
      attacker_slot: 0
      command_id: "GF_COMMAND_ID"
      command_arg: "GF_ARG"
      active: 1
  - action: continue_execution
    label: "drive_to_gf_anchor"
    timeout_ms: 30000
    wait_until:
      - "bp_pending_transfer"
      - "bp_gf_cinematic"
      - "bp_gf_resolve_store"
      - "bp_apply_damage"

observe:
  - action: trace_breakpoint_hits
    label: "gf_payload_trace"
    timeout_ms: 30000
    wait_until:
      - "bp_pending_transfer"
      - "bp_gf_cinematic"
      - "bp_gf_resolve_store"
      - "bp_apply_damage"
    max_hits: 4
    on_hit:
      - action: read_registers
        label: "regs"
      - action: read_action_globals
        label: "action_globals"
      - action: snapshot_memory
        label: "gf_callback_ptr"
        address: "GF_CALLBACK_PTR"
        size: 4
        type: u32
      - action: snapshot_memory
        label: "gf_sequence_context"
        address: "GF_SEQUENCE_CONTEXT"
        size: 4
        type: u32
      - action: snapshot_memory
        label: "damage_result_buffer"
        address: "DAMAGE_RESULT_BUFFER"
        size: 24
        type: bytes
      - action: snapshot_all_slots
        label: "slots_during"
  - action: snapshot_all_slots
    label: "slots_after"
  - action: read_action_globals
    label: "action_globals_after"

assert:
  - check: breakpoint_was_hit
    label: "sync_atb"
  - check: breakpoint_was_hit
    label: "bp_pending_transfer"
  - check: breakpoint_was_hit
    label: "bp_gf_cinematic"

cleanup:
  - action: delete_breakpoint
    label: "bp_pending_transfer"
  - action: delete_breakpoint
    label: "bp_gf_cinematic"
  - action: delete_breakpoint
    label: "bp_gf_resolve_store"
  - action: delete_breakpoint
    label: "bp_apply_damage"

verdict_prompt: |
  Analyze this GF payload capture.
  Focus on:
  1. The callback/context pointer values and when they become meaningful.
  2. The action globals and any raw payload bytes visible during resolve/apply.
  3. Per-slot HP/status/flag deltas before, during, and after the GF.
  4. Whether this case narrows unresolved payload semantics, especially for support/status GFs.
  Evidence:
  {evidence_json}
