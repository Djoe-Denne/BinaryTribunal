id: "LIVE_FOLLOWUPS_TODO_001"
title: "Non-terminal live followups generated from ai-prompt/todo"

before_each:
  - action: manual_checkpoint
    label: "prepare_next_live_case"
    address: "0x4842B0"
    timeout_ms: 15000
    message: |
      Reste en combat et garde une situation stable pour la prochaine hypothèse.
      Évite de terminer le combat dans cette suite. Aucune action précise n'est requise ici :
      il s'agit juste de se recaler proprement avant le prochain scénario.
    fields:
      resume_execution: true
  - action: sync_to_battle_tick
    label: "reseed_sync"
    address: "0x4842B0"
    timeout_ms: 15000
  - action: set_enemy_hp_all_10000
    label: "reseed_enemy_hp"
    fields:
      hp: 65535

