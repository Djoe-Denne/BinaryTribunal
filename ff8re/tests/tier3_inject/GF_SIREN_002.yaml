# GF_SIREN_002: Resolve Siren shared init + tick and capture status payload
#
# Tier 3 -- Active injection (write memory, observe effects).
#
# Goal vs GF_SIREN_001:
# - Prove the shared task constructor `BdLinkTask_CreateAndInitContext` (0x8DC540) uses its 2nd arg as tick function ptr.
# - Capture runtime evidence that Siren's tick is `sub_739F40`.
# - Capture Siren counter increment + completion semantics from inside the tick.
# - Capture HIT_STATUS_1/2 at damage resolution (Silence bit should appear in HIT_STATUS_1).
#
# Injection bytes (pending entry 0): 08 80 00 03 43 00 00 01

id: "GF_SIREN_002"
title: "Inject GF Siren and identify tick/counter/completion"
domain: "gf_invocation"
confidence_target: "high"

references:
  - "tech/battle/G-Force/domain_gf_095siren_invocation.md"
  - "tech/domain_status_application_pipeline.md"
  - "ai-prompt/ai_investigation.md"

constants:
  ATB_TICK: 0x4842B0
  PENDING_BASE: 0x1D28D44
  GF_CALLBACK_PTR: 0x21DFEC4

  PENDING_TRANSFER: 0x4847F0
  GF_CINEMATIC_TICK: 0x50B2A0

  STATUS_APPLY: 0x4914E0
  RESOLVE_AND_APPLY: 0x48FE20
  APPLY_DAMAGE_OR_HEAL: 0x494410

  SIREN_ENTRY: 0x739DA0
  SHARED_INIT: 0x8DC540   # BdLinkTask_CreateAndInitContext (shared)
  SIREN_TICK: 0x739F40

  # Counter increments inside Siren tick (see disasm @ sub_739F40)
  SIREN_COUNTER_INC_A: 0x73A0A1  # inc word ptr [ctx+0x5C]
  SIREN_COUNTER_INC_B: 0x73A0A5  # inc word ptr [ctx+0x24]  (primary frame counter)

  # Completion path inside Siren tick
  SIREN_COMPLETION_CALL: 0x73A0B5  # calls sub_8DC530(ctx)
  SIREN_COMPLETION_RET2: 0x73A0BD  # mov eax, 2; retn

  GF_COMMAND_ID: 0x03
  SIREN_GF_INDEX: 0x43
  GF_TARGET_MASK: 0x8008

setup:
  - action: sync_to_battle_tick
    label: "sync_atb"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: set_enemy_hp_all_10000
    label: "reseed_enemy_hp"
    fields:
      hp: 10000
  - action: snapshot_memory
    label: "pending_buffer_backup"
    address: "PENDING_BASE"
    size: 24
    type: bytes
  - action: snapshot_memory
    label: "callback_ptr_before"
    address: "GF_CALLBACK_PTR"
    size: 4
    type: u32

  - action: snapshot_slot
    label: "enemy3_before"
    slot: 3
  - action: snapshot_slot
    label: "enemy4_before"
    slot: 4
  - action: snapshot_slot
    label: "enemy5_before"
    slot: 5

  - action: set_breakpoint
    address: "PENDING_TRANSFER"
    label: "bp_pending_transfer"
  - action: set_breakpoint
    address: "GF_CINEMATIC_TICK"
    label: "bp_gf_cinematic"

  # Counter/completion probes (more reliable than entry BP)
  - action: set_breakpoint
    address: "SIREN_COUNTER_INC_B"
    label: "bp_siren_counter_inc"
  - action: set_breakpoint
    address: "SIREN_COMPLETION_RET2"
    label: "bp_siren_completion_ret2"

act:
  - action: write_pending_action
    slot: 0
    fields:
      target_mask: 0x8008
      attacker_slot: 0
      command_id: 0x03
      command_arg: 0x43
      active: 1
  - action: read_pending_action
    label: "injected_pending_readback"
    slot: 0

  - action: continue_execution
    timeout_ms: 15000
    wait_until: ["bp_pending_transfer"]
  - action: check_breakpoint_hit
    label: "bp_pending_transfer"
    expect: hit
    fields:
      delete_if_hit: true
      min_hits: 1
  - action: read_registers
    label: "regs_at_pending_transfer"

observe:
  # Wait for cinematic dispatch; delete per-frame BP immediately after.
  - action: continue_execution
    timeout_ms: 30000
    wait_until:
      - "bp_gf_cinematic"
  - action: check_breakpoint_hit
    label: "bp_gf_cinematic"
    expect: hit
    fields:
      delete_if_hit: true
      min_hits: 1

  # If we set a breakpoint, we must *use* it: arm shared init, wait for it,
  # then auto-delete it after the first hit.
  - action: set_breakpoint
    address: "SHARED_INIT"
    label: "bp_shared_init"
  - action: continue_execution
    timeout_ms: 15000
    wait_until: ["bp_shared_init"]
  - action: check_breakpoint_hit
    label: "bp_shared_init"
    expect: hit
    fields:
      delete_if_hit: true
      min_hits: 1
  - action: read_registers
    label: "regs_at_shared_init"
  - action: read_stacktrace
    label: "stacktrace_at_shared_init"

  # Deterministic proof of dispatch: callback pointer should point at Siren entry.
  - action: snapshot_memory
    label: "callback_ptr_at_first_probe"
    address: "GF_CALLBACK_PTR"
    size: 4
    type: u32
  - action: read_registers
    label: "regs_at_first_probe"
  - action: read_stacktrace
    label: "stacktrace_at_first_probe"

  # Counter progression is the canonical "tick is running" marker for this chain.
  - action: continue_execution
    timeout_ms: 20000
    wait_until: ["bp_siren_counter_inc"]
  - action: check_breakpoint_hit
    label: "bp_siren_counter_inc"
    expect: hit
    fields:
      delete_if_hit: true
      min_hits: 1
  - action: read_registers
    label: "regs_at_tick_or_counter"
  - action: read_stacktrace
    label: "stacktrace_at_tick_or_counter"

  # Completion evidence (return 2 from tick)
  - action: continue_execution
    timeout_ms: 60000
    wait_until: ["bp_siren_completion_ret2"]
  - action: check_breakpoint_hit
    label: "bp_siren_completion_ret2"
    expect: hit
    fields:
      delete_if_hit: true
      min_hits: 1
  - action: read_registers
    label: "regs_at_completion"
  - action: read_stacktrace
    label: "stacktrace_at_completion"

  # Status/damage pipeline verification
  - action: set_breakpoint
    address: "RESOLVE_AND_APPLY"
    label: "bp_resolve_damage"
  - action: set_breakpoint
    address: "STATUS_APPLY"
    label: "bp_status_apply"
  - action: set_breakpoint
    address: "APPLY_DAMAGE_OR_HEAL"
    label: "bp_apply_damage"

  - action: continue_execution
    timeout_ms: 90000
    wait_until: ["bp_resolve_damage", "bp_apply_damage"]
  - action: read_action_globals
    label: "action_globals_at_resolve"
  - action: read_registers
    label: "regs_at_resolve"

  - action: continue_execution
    timeout_ms: 30000
    wait_until: ["bp_status_apply", "bp_apply_damage"]
  - action: read_registers
    label: "regs_at_status_or_damage"
  - action: read_stacktrace
    label: "stacktrace_at_status_or_damage"

  - action: continue_execution
    timeout_ms: 30000
    wait_until: ["bp_apply_damage"]
  - action: read_action_globals
    label: "action_globals_at_apply"

  - action: delete_breakpoint
    label: "bp_resolve_damage"
  - action: delete_breakpoint
    label: "bp_status_apply"
  - action: delete_breakpoint
    label: "bp_apply_damage"

  - action: sync_to_battle_tick
    label: "sync_post"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: snapshot_slot
    label: "enemy3_after"
    slot: 3
  - action: snapshot_slot
    label: "enemy4_after"
    slot: 4
  - action: snapshot_slot
    label: "enemy5_after"
    slot: 5

assert:
  - check: breakpoint_was_hit
    label: "sync_atb"
  - check: breakpoint_was_hit
    label: "bp_pending_transfer"
  - check: breakpoint_was_hit
    label: "bp_shared_init"
  - check: breakpoint_was_hit
    label: "bp_siren_counter_inc"
  - check: value_equals
    label: "callback_ptr_at_first_probe"
    fields:
      expected: 0x739DA0
  - check: breakpoint_was_hit
    label: "bp_siren_completion_ret2"
  - check: breakpoint_was_hit
    label: "bp_apply_damage"

cleanup:
  - action: restore_snapshot
    label: "restore_pending"
    address: "PENDING_BASE"
    fields:
      source: "pending_buffer_backup"

verdict_prompt: |
  Analyze GF_SIREN_002 evidence.

  Goals:
  - Confirm dispatch (GF_CALLBACK_PTR == 0x739DA0).
  - Confirm per-frame Siren tick progression (counter increment BP hit).
  - Report HIT_STATUS_1/2 at resolve and confirm Silence bit presence in HIT_STATUS_1.

  Evidence:
  {evidence_json}

