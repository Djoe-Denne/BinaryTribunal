# GF_QUEZACOTL_001: Inject a GF Quezacotl command and validate invocation chain
#
# Tier 3 -- Active injection (write memory, observe effects).
#
# Validates the Quezacotl summon invocation chain from:
# - tech/battle/G-Force/domain_gf_116quezacotl_invocation.md
# - tech/battle/G-Force/domain_gf_batch_index.md
#
# How to run:
#   The game can be in ANY of these states:
#     1. Running (in an active battle)
#     2. Paused (debugger suspended at any point during battle)
#     3. Paused at a breakpoint
#   The framework handles synchronization automatically.
#
# What it does:
#   1. Syncs to a known battle-tick boundary (BattleATB_TickAndReady)
#   2. Snapshots current pending action buffer for later restoration
#   3. Injects a GF Quezacotl command into the pending action buffer
#   4. Arms breakpoints on competing Quezacotl invocation candidates
#   5. Continues execution and observes the invocation and damage stages
#   6. Restores pending buffer and removes all breakpoints
#
# Command injection values:
#   - command_id  = 0x03 for GF   (confirmed globally from Ifrit capture)
#   - command_arg = 0x40 for Quezacotl (HYPOTHESIZED from pattern 0x40 + GF index)
#   - target_mask = 0x8008         (confirmed for Ifrit, assumed shared)
#
# Hypothesized raw pending entry bytes: 08 80 00 03 40 00 00 01

id: "GF_QUEZACOTL_001"
title: "Inject GF Quezacotl pending action and validate invocation chain"
domain: "gf_invocation"
confidence_target: "high"

references:
  - "tech/battle/G-Force/domain_gf_116quezacotl_invocation.md"
  - "tech/battle/G-Force/domain_gf_batch_index.md"
  - "tech/battle/G-Force/domain_gf_batch_inventory.json"
  - "tech/domain_battle_command_menu.md"
  - "ai-prompt/gf_hypothesis_from_documentation.md"

constants:
  # Battle tick sync point
  ATB_TICK: 0x4842B0              # BattleATB_TickAndReady (fires every frame)

  # Pending action buffer
  PENDING_BASE: 0x1D28D44
  PENDING_STRIDE: 0x08

  # GF cinematic dispatcher
  GF_CINEMATIC_TICK: 0x50B2A0     # BattleActionSequence_Tick_GF_Cinematic

  # Active GF callback pointer (global, persistent across invocations)
  GF_CALLBACK_PTR: 0x21DFEC4

  # Canonical Quezacotl chain (expanded static reconstruction)
  QUEZACOTL_ENTRY:          0x6c3550   # GF_116Quezacotl_InvokeSummonScript
  QUEZACOTL_INIT:           0x6c3640   # GF_116Quezacotl_InitSummonContext
  QUEZACOTL_TASK_DRIVER:    0x6c3760   # GF_116Quezacotl_SequenceTaskDriver
  QUEZACOTL_CHARGE_TASK:    0x6c3940   # GF_116Quezacotl_ChargeTimelineTask
  QUEZACOTL_FRAME_TICK:     0x6c6660   # GF_116Quezacotl_FrameTick
  QUEZACOTL_COUNTER_MAIN:   0x6c3932   # main sequence increment
  QUEZACOTL_COUNTER_CHARGE: 0x6c51f2   # charge timeline increment
  QUEZACOTL_COUNTER_FRAME:  0x6c671d   # frametick-local increment
  QUEZACOTL_COMPLETE_MAIN:  0x6c3931   # main sequence completion bit return
  QUEZACOTL_COMPLETE_CHARGE: 0x6c51f0  # charge timeline return 2

  # Exploratory pointers from domain docs (role still unconfirmed)
  QUEZACOTL_EXTRA_PTR_A:    0x1D96AAC
  QUEZACOTL_EXTRA_PTR_B:    0x1D99A50

  # Pipeline functions
  PENDING_WRITE:            0x484D20   # BattlePendingAction_Write
  PENDING_TRANSFER:         0x4847F0   # BattlePendingAction_TransferToExecQueue
  ARBITRATION_SELECT:       0x485460   # BattleArbitration_SelectNextAction
  RESOLVE_SPECIAL:          0x485160   # BattleAction_ResolveSpecialActionAndUpdateDamage

  # Damage pipeline functions (shared)
  RESOLVE_AND_APPLY:        0x48FE20   # BattleAction_ResolveAndApplyDamage
  COMPUTE_DAMAGE:           0x4922B0   # Damage_ComputeRawDeltaFromAttackType
  APPLY_DAMAGE_OR_HEAL:     0x494410   # Battle_ApplyDamageOrHeal
  UPDATE_DAMAGE:            0x48EF80   # Battle_UpdateDamage

  # Command injection values (Quezacotl arg is still hypothesis)
  GF_COMMAND_ID:            0x03
  QUEZACOTL_GF_INDEX:       0x40
  GF_TARGET_MASK:           0x8008

# =====================================================================
# Phase 1: Setup -- sync to battle tick, snapshot state, arm breakpoints
# =====================================================================
setup:
  - action: sync_to_battle_tick
    label: "sync_atb"
    address: "ATB_TICK"
    timeout_ms: 15000

  - action: snapshot_memory
    label: "pending_buffer_backup"
    address: "PENDING_BASE"
    size: 24
    type: bytes

  - action: snapshot_slot
    label: "target_slot3_before"
    slot: 3

  - action: snapshot_slot
    label: "target_slot4_before"
    slot: 4

  - action: snapshot_slot
    label: "target_slot5_before"
    slot: 5

  - action: snapshot_memory
    label: "callback_ptr_before"
    address: "GF_CALLBACK_PTR"
    size: 4
    type: u32

  - action: set_breakpoint
    address: "GF_CINEMATIC_TICK"
    label: "bp_gf_cinematic"

  - action: set_breakpoint
    address: "QUEZACOTL_ENTRY"
    label: "bp_quezacotl_entry"

  - action: set_breakpoint
    address: "QUEZACOTL_INIT"
    label: "bp_quezacotl_init"

  - action: set_breakpoint
    address: "QUEZACOTL_TASK_DRIVER"
    label: "bp_quezacotl_task_driver"

  - action: set_breakpoint
    address: "QUEZACOTL_CHARGE_TASK"
    label: "bp_quezacotl_charge_task"

  - action: set_breakpoint
    address: "QUEZACOTL_FRAME_TICK"
    label: "bp_quezacotl_frame_tick"

  - action: set_breakpoint
    address: "QUEZACOTL_COUNTER_MAIN"
    label: "bp_quezacotl_counter_main"

  - action: set_breakpoint
    address: "QUEZACOTL_COUNTER_CHARGE"
    label: "bp_quezacotl_counter_charge"

  - action: set_breakpoint
    address: "QUEZACOTL_COUNTER_FRAME"
    label: "bp_quezacotl_counter_frame"

  - action: set_breakpoint
    address: "QUEZACOTL_COMPLETE_MAIN"
    label: "bp_quezacotl_complete_main"

  - action: set_breakpoint
    address: "QUEZACOTL_COMPLETE_CHARGE"
    label: "bp_quezacotl_complete_charge"

  - action: set_breakpoint
    address: "PENDING_TRANSFER"
    label: "bp_pending_transfer"

  - action: set_breakpoint
    address: "ARBITRATION_SELECT"
    label: "bp_arbitration"

# =====================================================================
# Phase 2: Act -- inject the GF Quezacotl command
# =====================================================================
act:
  - action: write_pending_action
    slot: 0
    fields:
      target_mask: 0x8008
      attacker_slot: 0
      command_id: 0x03
      command_arg: 0x40
      active: 1

  - action: read_pending_action
    label: "injected_pending_readback"
    slot: 0

  - action: continue_execution
    timeout_ms: 15000
    wait_until:
      - "bp_pending_transfer"

  - action: check_breakpoint_hit
    label: "bp_pending_transfer"
    expect: hit

  - action: read_registers
    label: "regs_at_transfer"

  - action: delete_breakpoint
    label: "bp_pending_transfer"

  - action: delete_breakpoint
    label: "bp_arbitration"

  - action: continue_execution
    timeout_ms: 30000
    wait_until:
      - "bp_gf_cinematic"
      - "bp_quezacotl_entry"
      - "bp_quezacotl_init"
      - "bp_quezacotl_task_driver"
      - "bp_quezacotl_charge_task"
      - "bp_quezacotl_frame_tick"
      - "bp_quezacotl_counter_main"
      - "bp_quezacotl_counter_charge"
      - "bp_quezacotl_counter_frame"

# =====================================================================
# Phase 3: Observe -- trace through the GF cinematic / Quezacotl chain
# =====================================================================
observe:
  # Capture callback pointer as soon as cinematic dispatch breaks.
  - action: snapshot_memory
    label: "callback_ptr_at_cinematic_entry"
    address: "GF_CALLBACK_PTR"
    size: 4
    type: u32

  # Remove routing BPs.
  - action: delete_breakpoint
    label: "bp_gf_cinematic"

  - action: delete_breakpoint
    label: "bp_quezacotl_entry"

  - action: delete_breakpoint
    label: "bp_quezacotl_init"

  - action: delete_breakpoint
    label: "bp_quezacotl_task_driver"

  - action: delete_breakpoint
    label: "bp_quezacotl_charge_task"

  # Continue to deeper sequence points.
  - action: continue_execution
    timeout_ms: 15000
    wait_until:
      - "bp_quezacotl_frame_tick"
      - "bp_quezacotl_counter_main"
      - "bp_quezacotl_counter_charge"
      - "bp_quezacotl_counter_frame"

  # Informational only (no expect field): tick prologue may be unreliable.
  - action: check_breakpoint_hit
    label: "bp_quezacotl_frame_tick"

  - action: snapshot_memory
    label: "callback_ptr_during"
    address: "GF_CALLBACK_PTR"
    size: 4
    type: u32

  - action: snapshot_memory
    label: "quezacotl_extra_ptr_a"
    address: "QUEZACOTL_EXTRA_PTR_A"
    size: 4
    type: u32

  - action: snapshot_memory
    label: "quezacotl_extra_ptr_b"
    address: "QUEZACOTL_EXTRA_PTR_B"
    size: 4
    type: u32

  - action: delete_breakpoint
    label: "bp_quezacotl_frame_tick"

  # Wait for one of the competing counter increment candidates.
  - action: continue_execution
    timeout_ms: 20000
    wait_until:
      - "bp_quezacotl_counter_main"
      - "bp_quezacotl_counter_charge"
      - "bp_quezacotl_counter_frame"

  # Record hit states for ambiguity resolution.
  - action: check_breakpoint_hit
    label: "bp_quezacotl_counter_main"

  - action: check_breakpoint_hit
    label: "bp_quezacotl_counter_charge"

  - action: check_breakpoint_hit
    label: "bp_quezacotl_counter_frame"

  - action: read_registers
    label: "regs_at_counter_window"

  - action: read_stacktrace
    label: "stacktrace_at_counter_window"

  # Check completion candidates quickly before moving to damage phase.
  - action: continue_execution
    timeout_ms: 10000
    wait_until:
      - "bp_quezacotl_complete_main"
      - "bp_quezacotl_complete_charge"
      - "bp_quezacotl_counter_main"
      - "bp_quezacotl_counter_charge"
      - "bp_quezacotl_counter_frame"

  - action: check_breakpoint_hit
    label: "bp_quezacotl_complete_main"

  - action: check_breakpoint_hit
    label: "bp_quezacotl_complete_charge"

  # Remove invocation BPs and arm damage BPs.
  - action: delete_breakpoint
    label: "bp_quezacotl_counter_main"

  - action: delete_breakpoint
    label: "bp_quezacotl_counter_charge"

  - action: delete_breakpoint
    label: "bp_quezacotl_counter_frame"

  - action: delete_breakpoint
    label: "bp_quezacotl_complete_main"

  - action: delete_breakpoint
    label: "bp_quezacotl_complete_charge"

  - action: set_breakpoint
    address: "RESOLVE_AND_APPLY"
    label: "bp_resolve_and_apply"

  - action: set_breakpoint
    address: "APPLY_DAMAGE_OR_HEAL"
    label: "bp_apply_damage"

  - action: continue_execution
    timeout_ms: 90000
    wait_until:
      - "bp_resolve_and_apply"
      - "bp_apply_damage"

  - action: read_action_globals
    label: "action_globals_at_damage"

  - action: read_registers
    label: "regs_at_damage"

  - action: delete_breakpoint
    label: "bp_resolve_and_apply"

  - action: continue_execution
    timeout_ms: 30000
    wait_until:
      - "bp_apply_damage"

  - action: check_breakpoint_hit
    label: "bp_apply_damage"
    expect: hit

  - action: read_registers
    label: "regs_at_apply_damage"

  - action: read_stacktrace
    label: "stacktrace_at_apply_damage"

  - action: delete_breakpoint
    label: "bp_apply_damage"

  - action: sync_to_battle_tick
    label: "sync_post_damage"
    address: "ATB_TICK"
    timeout_ms: 15000

  - action: snapshot_slot
    label: "target_slot3_after"
    slot: 3

  - action: snapshot_slot
    label: "target_slot4_after"
    slot: 4

  - action: snapshot_slot
    label: "target_slot5_after"
    slot: 5

# =====================================================================
# Phase 4: Assert -- deterministic pass/fail
# =====================================================================
assert:
  # Stage 1: command injection consumed
  - check: breakpoint_was_hit
    label: "sync_atb"

  - check: breakpoint_was_hit
    label: "bp_pending_transfer"

  # Stage 2: sequence progression through expanded Quezacotl internals.
  - check: any_of
    label: "any_quezacotl_progression_marker"
    checks:
      - check: breakpoint_was_hit
        label: "bp_quezacotl_counter_main"
      - check: breakpoint_was_hit
        label: "bp_quezacotl_counter_charge"
      - check: breakpoint_was_hit
        label: "bp_quezacotl_counter_frame"
      - check: breakpoint_was_hit
        label: "bp_quezacotl_complete_main"
      - check: breakpoint_was_hit
        label: "bp_quezacotl_complete_charge"
      - check: breakpoint_was_hit
        label: "bp_resolve_and_apply"

  # Stage 3: shared damage pipeline
  - check: breakpoint_was_hit
    label: "bp_apply_damage"

  # Stage 4: HP change after damage application
  # At least one enemy slot (3-5) should change. Some encounters have dead slots.
  - check: any_of
    label: "any_enemy_hp_changed"
    checks:
      - check: value_changed
        before: "target_slot3_before"
        after: "target_slot3_after"
      - check: value_changed
        before: "target_slot4_before"
        after: "target_slot4_after"
      - check: value_changed
        before: "target_slot5_before"
        after: "target_slot5_after"

# =====================================================================
# Phase 5: Cleanup -- restore state, remove all breakpoints
# =====================================================================
cleanup:
  - action: restore_snapshot
    label: "restore_pending"
    address: "PENDING_BASE"
    fields:
      source: "pending_buffer_backup"

verdict_prompt: |
  You are analyzing evidence from a reverse engineering hypothesis test on
  FF8's GF invocation system, specifically Quezacotl (Thunder Storm).

  Hypothesis: Injecting pending action bytes 08 80 00 03 40 00 00 01
  (target_mask=0x8008, attacker_slot=0, command_id=0x03, command_arg=0x40)
  causes battle execution to:
  1. Consume the pending action (bp_pending_transfer)
  2. Route through GF cinematic dispatch (0x50B2A0)
  3. Enter the Quezacotl chain and increment per-frame state at either:
     - candidate A: 0x6c671d
     - candidate B: 0x6c51f2
  4. Return through the shared damage pipeline
  5. Apply measurable HP loss to at least one enemy slot

  Static chain baseline (expanded):
  - entry: 0x6c3550
  - init: 0x6c3640
  - task driver: 0x6c3760
  - charge timeline task: 0x6c3940
  - frame tick helper: 0x6c6660
  - progression markers include 0x6c3932, 0x6c51f2, 0x6c671d
  - completion markers include 0x6c3931 and 0x6c51f0

  Evidence collected:
  {evidence_json}

  Based on this evidence:
  1. Was the injected command consumed (bp_pending_transfer hit)?
  2. Which chain markers fired across entry/init/task/charge/frame layers?
  3. Did frame tick 0x6c6660 fire? If not, does other counter evidence still show sequence progress?
  4. Which progression markers fired first and which persisted?
  5. Did completion markers (0x6c3931 and/or 0x6c51f0) fire?
  6. Do action globals at damage indicate a GF action (COMMAND_TYPE_ID=0xFE)?
  7. What is CURRENT_ATTACK_MAGIC_GF_ITEM_COMMAND_ID at damage time, and does it match 0x40?
  8. Did target HP change (slot3_before vs slot3_after)? If not, where did execution stall?
  9. Is command_arg=0x40 likely correct, or is fallback manual capture needed?
  10. Recommend canonical invocation chain and confidence level update.
