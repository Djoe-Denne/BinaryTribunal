# GF_GRIEVER_001: Probe non-standard Griever availability by injected GF command

id: "GF_GRIEVER_001"
title: "Inject Griever-like GF command and validate unavailable behavior"
domain: "gf_invocation"
confidence_target: "low"

references:
  - "tech/battle/G-Force/domain_gf_069griever_invocation.md"
  - "tech/battle/G-Force/domain_gf_batch_inventory.json"
  - "ai-prompt/gf_hypothesis_from_documentation.md"

constants:
  ATB_TICK: 0x4842B0
  PENDING_BASE: 0x1D28D44
  GF_CINEMATIC_TICK: 0x50B2A0
  PENDING_TRANSFER: 0x4847F0
  ARBITRATION_SELECT: 0x485460
  APPLY_DAMAGE_OR_HEAL: 0x494410

  GRIEVER_ENTRY: 0x5755F0

  GF_COMMAND_ID: 0x03
  GRIEVER_GF_INDEX: 0x51
  GF_TARGET_MASK: 0x8008

setup:
  - action: sync_to_battle_tick
    label: "sync_atb"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: snapshot_memory
    label: "pending_buffer_backup"
    address: "PENDING_BASE"
    size: 24
    type: bytes
  - action: snapshot_slot
    label: "enemy3_before"
    slot: 3
  - action: set_breakpoint
    address: "GF_CINEMATIC_TICK"
    label: "bp_gf_cinematic"
  - action: set_breakpoint
    address: "GRIEVER_ENTRY"
    label: "bp_griever_entry"
  - action: set_breakpoint
    address: "APPLY_DAMAGE_OR_HEAL"
    label: "bp_apply_damage"
  - action: set_breakpoint
    address: "PENDING_TRANSFER"
    label: "bp_pending_transfer"
  - action: set_breakpoint
    address: "ARBITRATION_SELECT"
    label: "bp_arbitration"

act:
  - action: write_pending_action
    slot: 0
    fields:
      target_mask: 0x8008
      attacker_slot: 0
      command_id: 0x03
      command_arg: 0x51
      active: 1
  - action: continue_execution
    timeout_ms: 15000
    wait_until: ["bp_pending_transfer"]
  - action: check_breakpoint_hit
    label: "bp_pending_transfer"
    expect: hit
  - action: delete_breakpoint
    label: "bp_pending_transfer"
  - action: delete_breakpoint
    label: "bp_arbitration"

observe:
  - action: wait
    label: "settle_window"
    timeout_ms: 20000
    fields:
      resume_execution: true
  - action: sync_to_battle_tick
    label: "sync_post_probe"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: snapshot_slot
    label: "enemy3_after"
    slot: 3
  - action: delete_breakpoint
    label: "bp_gf_cinematic"
  - action: delete_breakpoint
    label: "bp_griever_entry"
  - action: delete_breakpoint
    label: "bp_apply_damage"

assert:
  - check: breakpoint_was_hit
    label: "sync_atb"
  - check: breakpoint_was_hit
    label: "bp_pending_transfer"
  - check: breakpoint_not_hit
    label: "bp_griever_entry"
  - check: breakpoint_not_hit
    label: "bp_apply_damage"

cleanup:
  - action: restore_snapshot
    label: "restore_pending"
    address: "PENDING_BASE"
    fields:
      source: "pending_buffer_backup"

verdict_prompt: |
  Analyze GF_GRIEVER_001 evidence.
  Goal: test whether an injected GF-style command_arg can dispatch Griever.
  Deterministic expectation in this probe is "not available":
  - pending action is consumed,
  - no hit on Griever entry marker,
  - no shared HP-apply breakpoint hit in probe window.
  Evidence:
  {evidence_json}
