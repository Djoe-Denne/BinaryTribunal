# GF_ODIN_001: Inject GF Odin and validate all-live-enemies are dead after summon

id: "GF_ODIN_001"
title: "Inject GF Odin pending action and validate full enemy wipe"
domain: "gf_invocation"
confidence_target: "medium"

references:
  - "tech/battle/G-Force/domain_gf_187odin_invocation.md"
  - "tech/battle/G-Force/domain_gf_batch_inventory.json"
  - "ai-prompt/gf_hypothesis_from_documentation.md"

constants:
  ATB_TICK: 0x4842B0
  PENDING_BASE: 0x1D28D44
  GF_CINEMATIC_TICK: 0x50B2A0
  PENDING_TRANSFER: 0x4847F0
  ARBITRATION_SELECT: 0x485460
  RESOLVE_AND_APPLY: 0x48FE20
  APPLY_DAMAGE_OR_HEAL: 0x494410

  ODIN_ENTRY: 0x6472E0
  ODIN_TICK: 0x64DD50
  ODIN_COUNTER_INC: 0x64DD61

  GF_COMMAND_ID: 0x03
  ODIN_GF_INDEX: 0x50
  GF_TARGET_MASK: 0x8008

setup:
  - action: sync_to_battle_tick
    label: "sync_atb"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: snapshot_memory
    label: "pending_buffer_backup"
    address: "PENDING_BASE"
    size: 24
    type: bytes
  - action: snapshot_slot
    label: "enemy3_before"
    slot: 3
  - action: snapshot_slot
    label: "enemy4_before"
    slot: 4
  - action: snapshot_slot
    label: "enemy5_before"
    slot: 5
  - action: snapshot_slot
    label: "enemy6_before"
    slot: 6
  - action: set_breakpoint
    address: "GF_CINEMATIC_TICK"
    label: "bp_gf_cinematic"
  - action: set_breakpoint
    address: "ODIN_ENTRY"
    label: "bp_odin_entry"
  - action: set_breakpoint
    address: "ODIN_COUNTER_INC"
    label: "bp_odin_counter_inc"
  - action: set_breakpoint
    address: "PENDING_TRANSFER"
    label: "bp_pending_transfer"
  - action: set_breakpoint
    address: "ARBITRATION_SELECT"
    label: "bp_arbitration"

act:
  - action: write_pending_action
    slot: 0
    fields:
      target_mask: 0x8008
      attacker_slot: 0
      command_id: 0x03
      command_arg: 0x50
      active: 1
  - action: continue_execution
    timeout_ms: 15000
    wait_until: ["bp_pending_transfer"]
  - action: check_breakpoint_hit
    label: "bp_pending_transfer"
    expect: hit
  - action: delete_breakpoint
    label: "bp_pending_transfer"
  - action: delete_breakpoint
    label: "bp_arbitration"

observe:
  - action: continue_execution
    timeout_ms: 30000
    wait_until: ["bp_gf_cinematic", "bp_odin_entry", "bp_odin_counter_inc"]
  - action: delete_breakpoint
    label: "bp_gf_cinematic"
  - action: delete_breakpoint
    label: "bp_odin_entry"
  - action: delete_breakpoint
    label: "bp_odin_counter_inc"
  - action: set_breakpoint
    address: "RESOLVE_AND_APPLY"
    label: "bp_resolve_and_apply"
  - action: set_breakpoint
    address: "APPLY_DAMAGE_OR_HEAL"
    label: "bp_apply_damage"
  - action: continue_execution
    timeout_ms: 90000
    wait_until: ["bp_resolve_and_apply", "bp_apply_damage"]
  - action: read_action_globals
    label: "action_globals_at_damage"
  - action: delete_breakpoint
    label: "bp_resolve_and_apply"
  - action: continue_execution
    timeout_ms: 30000
    wait_until: ["bp_apply_damage"]
  - action: delete_breakpoint
    label: "bp_apply_damage"
  - action: sync_to_battle_tick
    label: "sync_post_damage"
    address: "ATB_TICK"
    timeout_ms: 15000
  - action: snapshot_slot
    label: "enemy3_after"
    slot: 3
  - action: snapshot_slot
    label: "enemy4_after"
    slot: 4
  - action: snapshot_slot
    label: "enemy5_after"
    slot: 5
  - action: snapshot_slot
    label: "enemy6_after"
    slot: 6

assert:
  - check: breakpoint_was_hit
    label: "sync_atb"
  - check: breakpoint_was_hit
    label: "bp_pending_transfer"
  - check: breakpoint_was_hit
    label: "bp_apply_damage"
  - check: slot_killed_if_alive
    before: "enemy3_before"
    after: "enemy3_after"
  - check: slot_killed_if_alive
    before: "enemy4_before"
    after: "enemy4_after"
  - check: slot_killed_if_alive
    before: "enemy5_before"
    after: "enemy5_after"
  - check: slot_killed_if_alive
    before: "enemy6_before"
    after: "enemy6_after"

cleanup:
  - action: restore_snapshot
    label: "restore_pending"
    address: "PENDING_BASE"
    fields:
      source: "pending_buffer_backup"

verdict_prompt: |
  Analyze GF_ODIN_001 evidence.
  Validate that command_arg=0x50 dispatches Odin and kills all enemies that were alive before summon.
  For each enemy slot (3..6), if it was alive before, it must be dead after (HP=0 and/or Death status).
  Evidence:
  {evidence_json}
